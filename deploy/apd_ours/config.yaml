axelera-model-format: 1.0.0

name: apd_ours

description: >
  APD compliance, pose-anchored. A pose model finds people and its keypoints
  place anatomical ROIs; two small classifiers judge those ROIs. This differs
  from apd_v3, which detects PPE objects directly and then assigns them to
  people -- an assignment that fails when no person is detected, which measured
  37% of frames across 60 sites.

  ONE model only, on purpose. The two classifiers run on the CPU through ONNX
  Runtime inside the application, because their inputs are anatomical ROIs that
  the YAML pipeline builder cannot express. They were once listed here for
  reference; that was a mistake. create_inference_stream() deploys EVERY model
  a network declares, so the runtime tried to compile apd_ours_head on startup,
  failed, and the worker crash-looped once every 30 seconds while production
  kept running normally.

pipeline:
  - person_pose:
      model_name: apd_ours_pose
      input:
        type: image
      preprocess:
        - letterbox:
            width: ${{input_width}}
            height: ${{input_height}}
            scaleup: true
        - torch-totensor:
      inference:
        handle_all: false
      postprocess:
        - decodeyolopose:
            box_format: xywh
            normalized_coord: false
            max_nms_boxes: 30000
            conf_threshold: 0.40
            nms_iou_threshold: 0.45
            nms_top_k: 300

  # head ROI -> head_cap and mask, from one crop. The two attributes read the
  # same pixels, so they are exported as one network with two outputs; the
  # trunks inside it are independent (verified bit-exact against the models
  # they came from).
models:
  apd_ours_pose:
    class: AxONNXModel
    class_path: $AXELERA_FRAMEWORK/ax_models/base_onnx.py
    weight_path: yolo11s-pose.onnx   # was yolo11n-pose.onnx (2026-09-17: s finds ~20% more people)
    task_category: KeypointDetection
    input_tensor_layout: NCHW
    input_tensor_shape: [1, 3, 640, 640]
    input_color_format: RGB
    num_classes: 1
    dataset: apd_ours_dataset
    extra_kwargs:
      aipu_cores: 1
      max_compiler_cores: 4
      compilation_config:
        quantization_scheme: per_tensor_min_max
        aipu_cores_used: 1
        resources_used: 0.25
        # Match the SDK's own yolo11spose entry and production's apd_v3 build.
        # An earlier version of this file set tiling_depth: 6 and
        # split_buffer_promotion: true; apd_v3 compiled with tiling_depth 1 and
        # split_buffer_promotion false, and the zoo pose entry sets neither.
        # With max_tiling_attempts 8 the search grows with depth, and depth 6
        # left the lowering stage running for hours with no output.
        ignore_weight_buffers: false
        # NOTE: max_processes_used_during_compilation and
        # max_memory_used_during_compilation are RESTRICTED fields. Setting them
        # here is silently undone -- the compiler logs "resetting restricted
        # field ... to default" and uses -1 processes and 8 GiB. Peak memory has
        # to be bounded from outside the process instead, which sppg_steps.sh
        # does with --cpuset-cpus (fewer visible cores means fewer compiler
        # workers) and an optional --memory cap on the container.

  # NOTE: head/hand classifiers below are NOT compiled in the application route
  # (they run on CPU via ONNX Runtime). Kept for the alternative of compiling
  # them onto the AIPU; they calibrate on crops, not frames.
datasets:
  # Keypoint adapter with a CUSTOM COCO json. Not label_type COCO2017: that
  # branch downloads the real COCO dataset, which an edge device must not do.
  # calib.json + images/ ship with the bundle (scripts/89_make_calib_kpts.py):
  # 200 apd_v3 kitchen frames, keypoints from yolo11x-pose.
  apd_ours_dataset:
    class: KptDataAdapter
    class_path: $AXELERA_FRAMEWORK/ax_datasets/objdataadapter.py
    data_dir_name: /mnt/data/voyager-sdk/customers/apd_ours/dataset/
    label_type: COCOJSON
    # Without this the SDK treats the dataset as having no representative
    # images and downloads its own 400 generic COCO photos (coco2017_repr416.zip
    # from media.axelera.ai) to calibrate against -- a network fetch an edge
    # device should not need, and generic photos instead of the kitchen frames
    # that ship here on purpose.
    repr_imgs_dir_name: images
    img_dir: images          # adapter joins this with file_name; bare names in calib.json
    cal_data: calib.json
    val_data: calib.json

operators:
  decodeyolopose:
    class: DecodeYoloPose
    class_path: $AXELERA_FRAMEWORK/ax_models/decoders/yolopose.py
